name: Fetch COE Data

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
    # Result day: rounds close Wednesday 16:00 SGT (08:00 UTC); results land 16:30–19:00 SGT.
    # Every 10 min from 16:00 to 19:50 SGT so the push goes out within minutes (send_push.py dedupes).
    - cron: '*/10 8-11 * * 3'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and process COE data
        env:
          RESULTS_PUSH: ${{ secrets.FCM_SERVICE_ACCOUNT != '' }}
        run: python3 scripts/fetch_coe_data.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet v1/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1/latest.json v1/history.json v1/analytics.json v1/schedule.json
          git commit -m "chore: update COE data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # Publish to GitHub Pages from THIS workflow.
  #
  # Why: pushes made with the default GITHUB_TOKEN (the "Commit and push" step
  # above) deliberately do not trigger other workflows, so deploy.yml's `on:
  # push` never fired for data commits. Between 2026-03-28 and 2026-07-28 the
  # CDN kept serving March prices while the repo held current data.
  #
  # This job runs on every fetch (not only when data changed) so a single failed
  # deploy can't leave the CDN stale until the next data change.
  deploy:
    needs: fetch
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Result-day push, after the CDN is updated so a tap opens fresh data.
  push:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_FCM: ${{ secrets.FCM_SERVICE_ACCOUNT != '' }}
    concurrency:
      group: push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install FCM client
        if: env.HAS_FCM == 'true'
        run: pip install --quiet google-auth requests
      - name: Send push for a new round
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python3 scripts/send_push.py
      - name: Record the pushed round
        run: |
          if [ -n "$(git status --porcelain push/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add push/last_round.txt
            git commit -m "chore: push state $(cat push/last_round.txt)"
            git pull --rebase --quiet origin main
            git push
          fi
